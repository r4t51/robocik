<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Moja Planeta · p8</title>
    <meta
      name="description"
      content="Jesteś człowieczkiem. W gabinecie leczysz, pacjenci płacą. Hotel, sklep i twoja planeta."
    />
    <meta name="theme-color" content="#1a1840" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Lexend:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=p8" />
  </head>
  <body>
    <div class="space" id="space">
      <main class="globe">
        <header class="beam">
          <div id="sign" class="sign">Moja Planeta</div>
          <p id="nice" class="nice">Ładnie: 0</p>
        </header>
        <section id="stage" class="stage" aria-live="polite"></section>
        <p id="toast" class="toast" hidden></p>
        <aside id="talk" class="talk" hidden>
          <strong id="talk-name"></strong>
          <span id="talk-line"></span>
        </aside>
        <aside id="shop" class="shop-sheet" hidden>
          <strong>Sklep</strong>
          <p id="shop-cash">Masz 12 zł</p>
          <div id="shop-list" class="wares"></div>
          <button type="button" class="go" data-act="leave-shop">Wychodzę</button>
        </aside>
        <section id="dock" class="dock" hidden></section>
        <section id="deck" class="deck" hidden>
          <div
            id="stick"
            class="stick"
            role="application"
            aria-label="Chodzenie. Na komputerze strzałki albo WASD."
          >
            <span id="stick-knob" class="knob"></span>
          </div>
          <button id="act-btn" type="button">Wejdź</button>
        </section>
      </main>
    </div>
    <script src="data.js?v=p8"></script>
    <script src="world.js?v=p8"></script>
  </body>
</html>
