<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Bar Mniam</title>
    <meta
      name="description"
      content="Wybierz fryzurę, gotuj dla klientów i ulepszaj swój bar za zarobione monety."
    />
    <meta name="theme-color" content="#14352f" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Paytone+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="street">
      <main class="stall">
        <header class="beam">
          <div id="sign" class="sign">Bar Mniam</div>
          <p id="wallet" class="wallet">
            <span class="coin" aria-hidden="true"></span>
            <span id="money">0</span>
          </p>
        </header>

        <section id="stage" class="stage" aria-live="polite"></section>
        <p id="toast" class="toast" hidden></p>
      </main>
    </div>
    <script src="data.js"></script>
    <script src="cook.js"></script>
  </body>
</html>
