<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Lekarz · l2</title>
    <meta
      name="description"
      content="Jesteś lekarzem. Pacjenci płacą. Kupujesz plastry i lekarstwa na półki. Złe lekarstwo = więzienie."
    />
    <meta name="theme-color" content="#0f3d3e" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=l2" />
  </head>
  <body>
    <div class="ward" id="ward">
      <main class="clinic">
        <header class="beam">
          <div id="sign" class="sign">Lekarz</div>
          <p id="score" class="score">0 zł</p>
          <button id="shop-btn" class="mini" type="button">Sklep</button>
        </header>
        <section id="stage" class="stage" aria-live="polite"></section>
        <p id="toast" class="toast" hidden></p>
        <aside id="shop" class="shop-sheet" hidden>
          <strong>Sklep</strong>
          <p id="shop-cash">Masz 8 zł</p>
          <div id="shop-list" class="wares"></div>
          <button type="button" class="go" data-act="leave-shop">Wychodzę</button>
        </aside>
        <section id="deck" class="deck">
          <div
            id="stick"
            class="stick"
            role="application"
            aria-label="Chodzenie. Na komputerze strzałki albo WASD."
          >
            <span id="stick-knob" class="knob"></span>
          </div>
          <button id="act-btn" type="button">Weź</button>
        </section>
      </main>
    </div>
    <script src="data.js?v=l2"></script>
    <script src="clinic.js?v=l2"></script>
  </body>
</html>
